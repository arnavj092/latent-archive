name: Creator PR build check
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/creator-partner-panels]
permissions:
  contents: read
concurrency:
  group: creator-pr-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
        env:
          GITHUB_PAGES: true
