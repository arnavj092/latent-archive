<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><meta name="theme-color" content="#0a0b0c"/><meta name="description" content="Latent Archive — browse India’s Got Latent episodes, bonus content and behind-the-scenes entries."/><meta name="robots" content="index,follow"/><meta property="og:title" content="Latent Archive — India’s Got Latent"/><meta property="og:description" content="Browse episodes, bonus content and behind-the-scenes entries in one clean archive."/><meta property="og:type" content="website"/><meta name="twitter:card" content="summary"/><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" href="./icon.svg"/><title>Latent Archive — India’s Got Latent</title><style>
#la-preboot{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:#050505;overflow:hidden;opacity:1;animation:la-preboot-exit .68s cubic-bezier(.16,1,.3,1) 1.55s forwards;pointer-events:none}
.la-preboot-aura{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(217,16,27,.14) 0%,rgba(217,16,27,.045) 32%,transparent 68%);filter:blur(7px);opacity:0;transform:scale(.55);animation:la-preboot-aura 1.55s cubic-bezier(.16,1,.3,1) forwards}
.la-preboot-center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:230px}
.la-preboot-logo-wrap{width:92px;height:92px;display:grid;place-items:center;opacity:0;transform:translateY(10px) scale(.72);filter:blur(9px);animation:la-preboot-logo .9s cubic-bezier(.16,1,.3,1) .04s forwards}
.la-preboot-logo{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 42px rgba(217,16,27,.18))}
.la-preboot-wordmark{margin-top:19px;font:800 11px/1 Manrope,system-ui,sans-serif;letter-spacing:.38em;color:#f5f1eb;white-space:nowrap;opacity:0;transform:translateY(8px);animation:la-preboot-word .62s cubic-bezier(.16,1,.3,1) .31s forwards}
.la-preboot-line{width:46px;height:1px;margin-top:18px;background:rgba(255,255,255,.07);overflow:hidden;transform:scaleX(.15);opacity:0;animation:la-preboot-line .72s cubic-bezier(.16,1,.3,1) .48s forwards}
.la-preboot-line span{display:block;width:100%;height:100%;background:#d9101b;transform:scaleX(0);transform-origin:left center;animation:la-preboot-fill .62s cubic-bezier(.16,1,.3,1) .52s forwards}
.la-preboot-sub{margin-top:12px;color:#55545a;font:600 7px/1 Manrope,system-ui,sans-serif;letter-spacing:.25em;white-space:nowrap;opacity:0;transform:translateY(5px);animation:la-preboot-sub .48s ease .7s forwards}
@keyframes la-preboot-aura{0%{opacity:0;transform:scale(.55)}35%{opacity:1}100%{opacity:.72;transform:scale(1)}}
@keyframes la-preboot-logo{0%{opacity:0;transform:translateY(10px) scale(.72);filter:blur(9px)}55%{opacity:1;filter:blur(1px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes la-preboot-word{to{opacity:1;transform:translateY(0)}}
@keyframes la-preboot-line{to{opacity:1;transform:scaleX(1)}}
@keyframes la-preboot-fill{to{transform:scaleX(1)}}
@keyframes la-preboot-sub{to{opacity:1;transform:translateY(0)}}
@keyframes la-preboot-exit{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#la-preboot *{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}}
</style></head><body><div id="la-preboot" aria-hidden="true"><div class="la-preboot-aura"></div><div class="la-preboot-center"><div class="la-preboot-logo-wrap"><img src="/latent-archive-mark.png" alt="" class="la-preboot-logo"></div><div class="la-preboot-wordmark">LATENT ARCHIVE</div><div class="la-preboot-line"><span></span></div><div class="la-preboot-sub">THE COMPLETE ARCHIVE</div></div></div><div id="root"></div><script type="module" src="./src/main.jsx"></script></body></html>
